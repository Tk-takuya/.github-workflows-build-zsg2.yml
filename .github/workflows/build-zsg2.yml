              'if (pcm_file)',
              '{',
              '\tstd::fwrite(mix, sizeof(mix[0]), 4, pcm_file);',
              '}',
              '',
          ]
          def insert_pcm(m):
              indent = m.group(1)
              return '\n'.join(indent + line if line else '' for line in lines) + '\n' + m.group(0)

          if len(re.findall(pattern, text, flags=re.M)) != 1:
              raise RuntimeError('ZSG2 PCM hook anchor missing or ambiguous')
          text = re.sub(pattern, insert_pcm, text, flags=re.M)
          text = '\n'.join(line.rstrip() for line in text.splitlines()) + '\n'
          p.write_text(text)
          print('ZSG2 register hook: OK (explicit braces)')
          print('ZSG2 four-channel PCM hook: OK (explicit braces)')
          print('ZSG2 trailing whitespace cleanup: OK')
          PY

          git diff --check
          git diff --stat

      - name: Build MAME
        working-directory: mame
        run: |
          set -euo pipefail
          make -j2 \
            SUBTARGET=zsg2 \
            SOURCES=src/mame/sony/zn.cpp,src/mame/sony/taitogn.cpp \
            REGENIE=1 \
            TARGETOS=linux \
            PTR64=1 \
            OSD=sdl \
            OVERRIDE_CC=gcc-12 \
            OVERRIDE_CXX=g++-12 \
            NO_OPENGL=1 \
            NO_USE_PORTAUDIO=1 \
            NO_USE_PULSEAUDIO=1 \
            NO_USE_PIPEWIRE=1 \
            NO_USE_MIDI=1 \
            USE_QTDEBUG=0 \
            USE_PCAP=0 \
            USE_TAPTUN=0 \
            OPTIMIZE=2 \
            SYMBOLS=0

      - name: Verify and package
        working-directory: mame
        run: |
          set -euo pipefail
          OUT="../package/$ARTIFACT"
          mkdir -p "$OUT/bin" "$OUT/info" "$OUT/source"

          BIN=""
          for candidate in ./zsg2 ./mamezsg2 ./mame_zsg2
          do
            if test -x "$candidate"; then
              BIN="$candidate"
              break
            fi
          done
          if test -z "$BIN"; then
            echo "MAME executable not found"
            exit 1
          fi

          cp "$BIN" "$OUT/bin/mame-zsg2"
          chmod +x "$OUT/bin/mame-zsg2"
          "$BIN" -version > "$OUT/info/version.txt"
          "$BIN" -listfull > "$OUT/info/listfull.txt"

          for GAME in raystorm gdarius raycris coh1000t coh3002t
          do
            awk -v game="$GAME" '
              $1 == game { found=1; print }
              END { if (!found) exit 1 }
            ' "$OUT/info/listfull.txt"
            "$BIN" -listxml "$GAME" > "$OUT/info/$GAME.xml"
          done

          git rev-parse HEAD > "$OUT/info/mame_commit.txt"
          git diff > "$OUT/source/zsg2_analysis.patch"
          git show HEAD:src/devices/sound/zsg2.cpp > "$OUT/source/zsg2_original.cpp"
          cp src/devices/sound/zsg2.cpp "$OUT/source/zsg2_instrumented.cpp"
          cp src/devices/sound/zsg2.h "$OUT/source/"
          cp src/mame/sony/zn.cpp "$OUT/source/"
          cp src/mame/sony/taitogn.cpp "$OUT/source/"

          git ls-files '*taito_zm*' > "$OUT/info/zoom_source_files.txt"
          while IFS= read -r f; do
            if test -f "$f"; then
              cp "$f" "$OUT/source/"
            fi
          done < "$OUT/info/zoom_source_files.txt"

          ldd "$OUT/bin/mame-zsg2" > "$OUT/info/ldd.txt"
          file "$OUT/bin/mame-zsg2" > "$OUT/info/binary_type.txt"
          gcc-12 --version > "$OUT/info/compiler.txt"
          ldd --version > "$OUT/info/glibc.txt"
          if test -d plugins; then cp -a plugins "$OUT/"; fi
          if test -d hash; then cp -a hash "$OUT/"; fi
          if test -f COPYING; then cp COPYING "$OUT/"; fi
          cat "$OUT/info/version.txt"

          cd "$OUT"
          find . -type f ! -name SHA256SUMS.txt -print0 \
            | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt

      - name: Create ZIP
        run: |
          set -euo pipefail
          cd package
          zip -q -r "../$ARTIFACT.zip" "$ARTIFACT"
          cd ..
          unzip -t "$ARTIFACT.zip"
          sha256sum "$ARTIFACT.zip" > "$ARTIFACT.zip.sha256"
          ls -lh "$ARTIFACT.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: taito-zsg2-mame-linux-x86_64
          path: |
            taito-zsg2-mame-linux-x86_64.zip
            taito-zsg2-mame-linux-x86_64.zip.sha256
          compression-level: 0
